{% extends "base.html" %}
{% load task_extras %}
{% block title %}Delete project · Task Manager{% endblock %}

{% block content %}
<div class="confirm">
    <h2>Delete “{{ project.name }}”?</h2>
    <p>This removes the project only. Its tasks stay in your workspace, just ungrouped.</p>
    <form method="post" action="{% url 'project_delete' project.pk %}">
        {% csrf_token %}
        <div class="btns">
            <a href="{% url 'project_detail' project.pk %}" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-danger">
                {% icon 'trash' %}<span>Delete project</span>
            </button>
        </div>
    </form>
</div>
{% endblock %}
